{% extends 'base.html' %}

{% block content %}
<h1>{{ post.title }}</h1>
<p class="text-muted">
    Автор: {{ post.author }} · Категорія: {{ post.category }} ·
    {{ post.posted.strftime("%Y-%m-%d %H:%M") }}
</p>
<p>{{ post.content }}</p>

<a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-primary">Edit</a>
<a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger">Delete</a>
<a href="{{ url_for('posts.all_posts') }}" class="btn btn-secondary">Back</a>
{% endblock %}
