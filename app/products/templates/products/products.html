
{% extends 'base.html' %}

{% block content %}
<h1>Список товарів</h1>

<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <div class="card-body">
                <h2>{{ product.name }}</h2>
                <p>Ціна: {{ product.price }} $</p>
                <a href="{{ url_for('products.product_detail', id=product.id) }}"
                   class="btn btn-accent">
                    Детальніше
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
