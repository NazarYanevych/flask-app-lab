{% extends 'base.html' %}

{% block content %}
<h1>Users List ({{ users_list|length }})</h1>

{% if users_list %}
<table class="table table-striped table-bordered mt-3">
    <thead>
        <tr>
            <th>Id</th>
            <th>Username</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users_list %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="alert alert-info mt-3">Зареєстрованих користувачів поки немає.</div>
{% endif %}
{% endblock %}
