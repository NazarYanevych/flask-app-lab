{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm mb-3">
    <h1>Welcome, {{ username }}!</h1>
    <p class="lead mb-1">You have successfully logged in to your profile.</p>
    <p class="mb-0"><strong>Email:</strong> {{ email }}</p>
</div>

<form action="{{ url_for('users.logout') }}" method="POST" class="d-inline">
    <button type="submit" class="btn btn-danger">Logout</button>
</form>
<a href="{{ url_for('users.all_users') }}" class="btn btn-secondary">Users List</a>
{% endblock %}
